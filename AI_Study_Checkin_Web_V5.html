<style>

*{box-sizing:border-box}

.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}

.taskbox h4{margin:0 0 6px;font-size:13px;color:#42526b} .taskbox p{margin:0;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,select,input,textarea{font:inherit} button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}

select,input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:white}

.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start} .daytitle{font-weight:800}
.status{font-size:12px;padding:4px 8px;border-radius:99px;background:#f2f4f7}
.details{display:none;margin-top:12px} .daycard.open .details{display:block}
.controls{display:grid;grid-template-columns:150px 135px 1fr;gap:8px;margin-top:10px}

.streak{font-size:12px;opacity:.9}

 .stats{grid-template-columns:1fr 1fr} .grid4{grid-template-columns:1fr} .controls{grid-template-columns:1fr}

const KEY='ai_learning_checkin_v4';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getS(day){return state[day]||{status:'未开始',hours:'',note:'',link:''}}
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  localStorage.setItem(KEY+'_backup',JSON.stringify({
    time:new Date().toISOString(),
    state:state
  }));
  renderAll()
}
function update(day,key,value){state[day]={...getS(day),[key]:value};save()}
function markDone(day){const s=getS(day);state[day]={...s,status:'已完成',hours:s.hours||TASKS.find(t=>t.day===day).plan};save();setTimeout(()=>document.getElementById('todayCard').scrollIntoView({behavior:'smooth'}),50)}

function calc(){
 const done=TASKS.filter(t=>getS(t.day).status==='已完成').length;
 const hrs=TASKS.reduce((a,t)=>a+(parseFloat(getS(t.day).hours)||0),0);
 let streak=0; for(const t of TASKS){if(getS(t.day).status==='已完成')streak++;else break}
 return {done,hrs,streak};
}


function renderSkills(){
  const total=TASKS.length||90;
  const done=TASKS.filter(t=>getS(t.day).status==='已完成').length;
  const p=Math.round(done/total*100);
  skillPython.textContent=Math.min(100,p+5)+'%';
  skillAI.textContent=Math.round(p*0.8)+'%';
  skillPLC.textContent=Math.round(p*0.35)+'%';
  skillEnglish.textContent=Math.round(p*0.45)+'%';
}

function renderStats(){
 const s=calc(); const pct=Math.round(s.done/TASKS.length*100);
 doneCount.textContent=`${s.done} / ${TASKS.length}`; rate.textContent=pct+'%'; bar.style.width=pct+'%';
 hours.textContent=s.hrs.toFixed(1)+' h'; streak.textContent=s.streak+' 天';
 streakText.textContent=s.done===90?'90天全部完成 🎉':`当前进度：${pct}%`;
}

function renderToday(){
 const t=TASKS.find(x=>getS(x.day).status!=='已完成')||TASKS[TASKS.length-1];
 const s=getS(t.day);
 todayCard.innerHTML=`
 <div><span class="pill">Day ${t.day}</span><span class="pill">第 ${t.week} 周</span></div>
 <h2 style="margin-top:10px">今天：${esc(t.topic)}</h2>
 <div class="small">计划学习 ${t.plan} 小时</div>
 <div class="grid4">
  <div class="taskbox"><h4>学习任务</h4><p>${esc(t.learn)}</p></div>
  <div class="taskbox"><h4>VS Code</h4><p>${esc(t.vscode)}</p></div>
  <div class="taskbox"><h4>Codex / AI Coding</h4><p>${esc(t.codex)}</p></div>
  <div class="taskbox"><h4>GitHub</h4><p>${esc(t.github)}</p></div>
 </div>
 <div class="controls">
  <select onchange="update(${t.day},'status',this.value)">${['未开始','进行中','已完成','需复习'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select>
  <input type="number" step="0.1" min="0" value="${esc(s.hours)}" placeholder="实际时长(h)" onchange="update(${t.day},'hours',this.value)">
  <input value="${esc(s.link)}" placeholder="GitHub / PR / 项目链接" onchange="update(${t.day},'link',this.value)">
 </div>
 <textarea placeholder="今天学到了什么？哪里没搞懂？" onchange="update(${t.day},'note',this.value)">${esc(s.note)}</textarea>
 <div class="actions"><button class="success" onclick="markDone(${t.day})">✓ 今天完成</button><button class="ghost" onclick="update(${t.day},'status','需复习')">标记需复习</button></div>`;
}

function renderList(){
 const wf=weekFilter.value, sf=statusFilter.value, q=search.value.trim().toLowerCase();
 list.innerHTML='';
 TASKS.filter(t=>{
   const s=getS(t.day), text=(t.topic+t.learn+t.vscode+t.codex+t.github).toLowerCase();
   return (!wf||String(t.week)===wf)&&(!sf||s.status===sf)&&(!q||text.includes(q));
 }).forEach(t=>{
   const s=getS(t.day), d=document.createElement('div');
   d.className='card daycard '+(s.status==='已完成'?'done':s.status==='需复习'?'review':'');
   d.innerHTML=`<div class="dayhead" onclick="this.parentElement.classList.toggle('open')" style="cursor:pointer">
     <div><span class="daytitle">Day ${t.day}</span> · 第 ${t.week} 周 · ${esc(t.topic)}</div>
     <span class="status">${s.status}</span>
   </div>
   <div class="details">
    <div class="grid4">
      <div class="taskbox"><h4>学习</h4><p>${esc(t.learn)}</p></div>
      <div class="taskbox"><h4>VS Code</h4><p>${esc(t.vscode)}</p></div>
      <div class="taskbox"><h4>Codex</h4><p>${esc(t.codex)}</p></div>
      <div class="taskbox"><h4>GitHub</h4><p>${esc(t.github)}</p></div>
    </div>
    <div class="controls">
      <select onchange="event.stopPropagation();update(${t.day},'status',this.value)">${['未开始','进行中','已完成','需复习'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select>
      <input type="number" step="0.1" min="0" value="${esc(s.hours)}" placeholder="实际时长(h)" onchange="update(${t.day},'hours',this.value)">
      <input value="${esc(s.link)}" placeholder="GitHub / PR 链接" onchange="update(${t.day},'link',this.value)">
    </div>
    <textarea placeholder="学习笔记" onchange="update(${t.day},'note',this.value)">${esc(s.note)}</textarea>
   </div>`;
   list.appendChild(d);
 });
}

function restoreLocalBackup(){
  const backup=localStorage.getItem(KEY+'_backup');
  if(!backup){alert('暂无自动备份');return}
  try{
    const obj=JSON.parse(backup);
    state=obj.state||{};
    save();
    alert('已恢复最近自动备份：'+obj.time);
  }catch(e){
    alert('恢复失败');
  }
}

function renderAll(){renderStats();renderSkills();renderToday();renderList()}

function exportData(){
 const blob=new Blob([JSON.stringify({version:4,state},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI_Study_Progress.json';a.click();URL.revokeObjectURL(a.href);
}
importFile.addEventListener('change',async e=>{
 const f=e.target.files[0]; if(!f)return;
 try{const obj=JSON.parse(await f.text());state=obj.state||obj;save();alert('进度导入成功')}catch{alert('导入失败：文件格式不正确')}
 e.target.value='';
});
for(let i=1;i<=13;i++){const o=document.createElement('option');o.value=i;o.textContent='第 '+i+' 周';weekFilter.appendChild(o)}
weekFilter.addEventListener('change',renderList);statusFilter.addEventListener('change',renderList);search.addEventListener('input',renderList);
renderAll();
</script>
